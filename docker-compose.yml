name: biblia-catolica
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biblia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-biblia}
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biblia}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    volumes: [redisdata:/data]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-minio}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    profiles: ["full"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-biblia}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-biblia}?schema=public
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    profiles: ["full"]
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
  redisdata:
  miniodata:
