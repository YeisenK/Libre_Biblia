# Opcional: autoalojar la versión web (archivos estáticos servidos por nginx).
# La app no necesita servidor propio; esto solo publica la PWA.
name: libre-biblia
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_DEFAULT_CATALOG_URL: ${NEXT_PUBLIC_DEFAULT_CATALOG_URL:-}
    ports: ["8080:80"]
    restart: unless-stopped
